name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test ./...
      - run: go vet ./...
      - name: Build native test server (Windows)
        if: runner.os == 'Windows'
        run: go build -o .local/fileshare-test.exe .
      - name: Build native test server (Unix)
        if: runner.os != 'Windows'
        run: go build -o .local/fileshare-test .
      - run: npm test
